name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: Example wiki checks with the built binary
        shell: bash
        run: |
          go build -o company-wiki ./cmd/company-wiki
          WIKI_CONFIG=examples/wiki-en.toml ./company-wiki lint
          WIKI_CONFIG=examples/wiki-en.toml ./company-wiki registry
          WIKI_CONFIG=examples/wiki-en.toml ./company-wiki review status
      - name: Windows PowerShell workspace smoke test
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          go build -o company-wiki.exe ./cmd/company-wiki
          $exe = (Resolve-Path .\company-wiki.exe).Path
          $workspace = Join-Path $env:RUNNER_TEMP ('wiki-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path (Join-Path $workspace 'docs') -Force | Out-Null
          Push-Location $workspace
          try {
            & $exe setup --source documents=docs
            if ($LASTEXITCODE -ne 0) { throw 'setup failed' }
            & $exe lint
            if ($LASTEXITCODE -ne 0) { throw 'lint failed' }
            & $exe review status
            if ($LASTEXITCODE -ne 0) { throw 'status failed' }
            & $exe registry
            if ($LASTEXITCODE -ne 0) { throw 'registry failed' }
          } finally {
            Pop-Location
            Remove-Item -LiteralPath $workspace -Recurse -Force
          }
