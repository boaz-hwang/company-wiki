# Copy to <wiki repository>/.github/workflows/wiki-check.yml.
# Post-push detector for the wiki repository, which holds only the wiki folder. Changes are checked
# before they land by `company-wiki review apply` (its lint) or by the owner's lint before a direct
# commit; this job catches what still reaches main: required fields, folders, wikilinks, related
# targets, the index, and change materials (cards, decisions, .md.txt drafts) that belong in workspace/wiki-changes. Cited sources are not on the runner, so `lint --wiki-only` reports cited
# files and registry hashes as info instead of failing; check those with lint and registry on a machine that has the sources (~/company-wiki).
name: Wiki check
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://raw.githubusercontent.com/boaz-hwang/company-wiki/main/install.sh | sh
      - run: ~/.local/bin/company-wiki lint --wiki-only
