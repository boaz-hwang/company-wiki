# Reference for every option. company-wiki setup writes ~/company-wiki/wiki.toml with the sources you select;
# this file's own documents source points to the bundled examples.
# The layout next to wiki.toml is fixed and has no settings: llm-wiki/ is the wiki (adopted knowledge only:
# concepts/, entities/, policies/, index.md, SCHEMA.md, citation hashes in .verification/), and
# workspace/wiki-changes/ holds change materials (drafts, reviews, decisions) outside the wiki.
[wiki]
title = "Company Wiki"
reviewer = "human:owner"
language = "ko"

[sources.documents]
kind = "documents"
path = "examples/raw"
include = ["**/*.md", "**/*.mdx"]
exclude = ["**/.env*", "**/node_modules/**", "**/.git/**"]

# Paths are relative to this configuration file, or absolute / ~/ paths.
# Enable only the sources in scope. include/exclude guide the agent's inventory.
# kind: documents, code, slack, jira, notion, confluence, claude, codex.
# Slack, Jira, Notion and Confluence point to a folder of text exports with the original URL/ID in each file.
# [sources.code]
# kind = "code"
# path = "/path/to/repository"
# [sources.slack]
# kind = "slack"
# path = "/path/to/exports/slack"
# [sources.jira]
# kind = "jira"
# path = "/path/to/exports/jira"
# [sources.notion]
# kind = "notion"
# path = "/path/to/exports/notion"
# [sources.confluence]
# kind = "confluence"
# path = "/path/to/exports/confluence"
# [sources.claude-sessions]
# kind = "claude"
# path = "~/.claude/projects/YOUR-PROJECT"
# project = "/path/to/your/project"
# [sources.codex-sessions]
# kind = "codex"
# path = "~/.codex/sessions"
# project = "/path/to/your/project"
